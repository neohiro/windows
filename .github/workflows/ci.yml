name: CI - Test & Lint

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
      - '*.json'
      - '*.yaml'
      - '*.yml'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
      - '*.json'
      - '*.yaml'
      - '*.yml'

permissions:
  contents: read

jobs:
  test:
    name: Regression Tests
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Regenerate Manifest (LF line endings)
        shell: pwsh
        run: |
          $repoRoot = (Get-Item -Path "." -Verbose).FullName
          $files = Get-ChildItem -Recurse -File | Where-Object { 
              $_.Extension -in '.ps1','.psd1','.cmd','.md' -and 
              $_.FullName -notmatch '\\.git\\' 
          } | Sort-Object FullName
          
          $manifest = @()
          foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              $rel = $f.FullName.Substring($repoRoot.Length + 1).Replace('\','/')
              $manifest += "$hash  $rel"
          }
          
          $manifest | Set-Content manifest.sha256 -Encoding UTF8
          Write-Host "Generated manifest.sha256 with $($manifest.Count) entries"

      - name: Run Regression Suite
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests/regression.ps1

      - name: Verify Manifest Completeness
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.sha256 -Raw
          $entries = $manifest -split "`r?`n" | Where-Object { $_ -match '^[a-f0-9]{64}\s{2}.+$' }
          Write-Host "Manifest entries: $($entries.Count)"
          
          $missing = @()
          foreach ($line in $entries) {
              if ($line -match '^[a-f0-9]{64}\s{2}(.+)$') {
                  $path = $Matches[1]
                  if (-not (Test-Path $path)) {
                      $missing += $path
                  }
              }
          }
          if ($missing.Count -gt 0) {
              Write-Error "Manifest references missing files: $($missing -join ', ')"
              exit 1
          }
          Write-Host "All manifest files present."

  lint:
    name: PowerShell Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules\PSScriptAnalyzer
            ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            psscriptanalyzer-${{ runner.os }}-
      - name: Install PSScriptAnalyzer (if not cached)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer -ErrorAction SilentlyContinue)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          } else {
              Write-Host "PSScriptAnalyzer found in cache"
          }
      - name: Run Lint (Errors Only)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
              $results | Format-Table RuleName, Severity, File, Line, Message -AutoSize
              Write-Error "PSScriptAnalyzer found $($results.Count) errors"
              exit 1
          }
          Write-Host "No lint errors (warnings allowed)."

  verify-bootstrap:
    name: Verify Bootstrap Parses
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - name: Parse Bootstrap (Syntax Check)
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile('bootstrap.ps1', [ref]$null, [ref]$null)
          Write-Host "bootstrap.ps1 parses cleanly"

      - name: Verify Help Comment Block
        shell: pwsh
        run: |
          $content = Get-Content bootstrap.ps1 -Raw
          if ($content -notmatch '\.SYNOPSIS') {
              Write-Error "Missing .SYNOPSIS help block"
              exit 1
          }
          Write-Host "Help comment block present"

      - name: Verify Bootstrap Handles Missing Manifest Gracefully
        shell: pwsh
        run: |
          # Test that bootstrap fails gracefully when manifest is missing (offline scenario)
          $tempDir = Join-Path $env:TEMP "HardenWindows-test-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Copy-Item bootstrap.ps1 $tempDir
          Set-Location $tempDir
          # Use a non-existent HTTP URL - should fail gracefully, not crash
          $result = & .\bootstrap.ps1 -Profile Home -Source "http://127.0.0.1:9/nonexistent" -NoElevate -SkipVerify 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Error "Expected bootstrap to fail with missing manifest"
              exit 1
          }
          Write-Host "Bootstrap handles missing manifest gracefully (exit code: $LASTEXITCODE)"

  verify-modules:
    name: Verify Module Structure
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - name: Check All Modules Have Set-* Function
        shell: pwsh
        run: |
          $modules = Get-ChildItem modules\*.ps1
          $expectedFunctions = @{
              'core'                = 'Set-CoreSettings'
              'defender'            = 'Set-DefenderSettings'
              'firewall'            = 'Set-FirewallSettings'
              'smb_network'         = 'Set-SmbNetworkSettings'
              'account_lockout'     = 'Set-AccountLockoutSettings'
              'usb_autoplay'        = 'Set-UsbAutoplaySettings'
              'powershell_logging'  = 'Set-PowerShellLogging'
              'audit_logging'       = 'Set-AuditLogging'
              'browser'             = 'Set-BrowserSettings'
              'office'              = 'Set-OfficeSettings'
              'privacy'             = 'Set-PrivacySettings'
              'fileassoc'           = 'Set-FileAssocSettings'
              'biometrics'          = 'Set-BiometricsSettings'
              'powershell_v2'       = 'Set-PowerShellV2'
              'optional_features'   = 'Set-OptionalFeatures'
              'backup_recovery'     = 'Set-BackupRecovery'
              'service_debloater'   = 'Set-ServiceDebloater'
              'appx_debloater'      = 'Set-AppxDebloater'
          }
          $missing = @()
          foreach ($m in $modules) {
              $name = $m.BaseName
              $fn = $expectedFunctions[$name]
              if (-not $fn) {
                  $missing += "$name (no expected function mapping)"
                  continue
              }
              $content = Get-Content $m.FullName -Raw
              if ($content -notmatch "function\s+$fn\s*[\(\{]") {
                  $missing += "$name -> $fn"
              }
          }
          if ($missing.Count -gt 0) {
              Write-Error "Modules missing Set-* function: $($missing -join ', ')"
              exit 1
          }
          Write-Host "All $($modules.Count) modules have Set-* function"

      - name: Verify fnMap Coverage
        shell: pwsh
        run: |
          $orchestrator = Get-Content Harden-Windows.ps1 -Raw
          $fnMapMatches = [regex]::Matches($orchestrator, "'([^']+)'\s*=\s*'Set-([^']+)'")
          $mappedModules = @()
          foreach ($m in $fnMapMatches) {
              $mappedModules += $m.Groups[1].Value
          }
          
          $modules = Get-ChildItem modules\*.ps1 | ForEach-Object { $_.BaseName }
          $unmapped = $modules | Where-Object { $_ -notin $mappedModules }
          if ($unmapped.Count -gt 0) {
              Write-Error "Modules not in fnMap: $($unmapped -join ', ')"
              exit 1
          }
          Write-Host "fnMap covers all $($modules.Count) modules"

  verify-core-functions:
    name: Verify Core Functions Export
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Core Function Exports
        shell: pwsh
        run: |
          . ./lib/core.ps1
          $requiredFunctions = @(
              'Invoke-SelfElevate', 'Test-IsAdmin', 'Test-WindowsVersion', 'Write-Banner',
              'Write-Section', 'Write-Pass', 'Write-Warn', 'Write-Info', 'Write-Skip',
              'Initialize-Logging', 'Add-Change', 'Close-Logging',
              'Show-MainMenu', 'Invoke-TimedPrompt', 'Test-IsInteractive',
              'New-Snapshot', 'Restore-Snapshot', 'New-SystemRestorePoint',
              'Get-AllowList', 'Set-AllowList', 'Invoke-Cmd'
          )
          $missing = @()
          foreach ($f in $requiredFunctions) {
              if (-not (Get-Command $f -ErrorAction SilentlyContinue)) {
                  $missing += $f
              }
          }
          if ($missing.Count -gt 0) {
              Write-Error "Missing core functions: $($missing -join ', ')"
              exit 1
          }
          Write-Host "All $($requiredFunctions.Count) core functions exported"

  verify-config:
    name: Verify Config Files
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Profiles Config
        shell: pwsh
        run: |
          $pd = Import-PowerShellDataFile -Path config/profiles.psd1
          foreach ($k in 'Home','Workstation','Developer') {
              if (-not $pd.ContainsKey($k)) { throw "Missing profile: $k" }
              if ($pd[$k].Modules.Count -lt 5) { throw "$k has too few modules: $($pd[$k].Modules.Count)" }
          }
          Write-Host "Profiles config valid"
      
      - name: Verify AllowList Config
        shell: pwsh
        run: |
          $al = Import-PowerShellDataFile -Path config/default.AllowList.psd1
          if ($null -eq $al) { throw "AllowList is null" }
          if ($null -eq $al.Services) { throw "AllowList.Services missing" }
          if ($null -eq $al.Appx) { throw "AllowList.Appx missing" }
          if ($null -eq $al.Modules) { throw "AllowList.Modules missing" }
          Write-Host "AllowList config valid"