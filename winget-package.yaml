  - 4 profiles: Home, Workstation, Developer, Custom
  - Allow-list engine (services, Appx, per-module)
  - Full rollback via registry + service snapshots
  - Dry-run mode for safe preview
  - SHA-256 verified bootstrap (26-file manifest)
  - 71 regression tests
