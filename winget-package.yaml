ShortDescription: One-command Windows 10/11 hardening with interactive profiles, allow-lists, rollback, and SHA-256 verified bootstrap
Description: Harden-Windows is a production-grade Windows hardening suite with 18 modular hardening domains (Defender ASR, Firewall, SMB/Network, Privacy, Account Lockout, USB, PowerShell Logging, Audit, Browser, Office, File Associations, Biometrics, PSv2 Removal, Service/Appx Debloaters, Optional Features, Backup/Recovery). Features 4 interactive profiles (Home, Workstation, Developer, Custom), allow-list engine for exemptions, full registry+service snapshot rollback, dry-run preview mode, and a SHA-256 verified bootstrap installer (irm | iex).
